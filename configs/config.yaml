# ASTRAQUANT X — Central Configuration
# Project: AI-Driven Adaptive Quantitative Trading and Intelligent Execution Framework

system:
  project_name: "ASTRAQUANT X"
  random_seed: 42
  log_level: "INFO"
  log_file: "logs/astraquant.log"

paths:
  raw_fi2010_dir: "data/raw/fi2010"
  processed_fi2010_dir: "data/processed/fi2010"
  raw_benchmark_dir: "BenchmarkDatasets/BenchmarkDatasets"
  raw_nifty_daily_dir: "NIFTY-50-Stock-Market-Data-main/NIFTY-50-Stock-Market-Data-main/data"
  raw_nifty_intraday_dir: "nifty50-historical-data-main/nifty50-historical-data-main"
  processed_nifty_dir: "data/processed/nifty50"
  processed_multistock_dir: "data/processed/multistock"
  model_save_dir: "models"
  results_dir: "results"
  reports_dir: "reports"
  logs_dir: "logs"

fi2010:
  num_features: 144
  default_horizon: 100
  horizons: [10, 20, 30, 50, 100]
  label_mapping:
    1: "Upward"
    2: "Stationary"
    3: "Downward"
  normalization_types: ["ZScore", "MinMax", "DecPre"]

nifty50:
  timeframes: ["1d", "1min", "15sec"]
  trading_hours_per_day: 6.25
  annualization_factor: 252
  intraday_start_time: "09:15:00"
  intraday_end_time: "15:30:00"

models:
  random_forest:
    n_estimators: 150
    max_depth: 20
    min_samples_leaf: 5
    class_weight: "balanced_subsample"
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: "hist"
    random_state: 42
    n_jobs: 4
  lstm:
    input_dim: 144
    sequence_length: 10
    hidden_dim: 64
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    epochs: 15
    batch_size: 64
    patience: 4
  transformer:
    input_dim: 144
    sequence_length: 10
    d_model: 64
    n_heads: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.1
    learning_rate: 0.001
    epochs: 15
    batch_size: 64
    patience: 4

regime_detection:
  n_regimes: 6
  regime_names:
    - "BULLISH_TRENDING"
    - "BEARISH_TRENDING"
    - "SIDEWAYS_RANGE_BOUND"
    - "HIGH_VOLATILITY"
    - "LOW_VOLATILITY"
    - "STRESS_ABNORMAL"
  volatility_window: 20
  trend_window: 50
  drawdown_window: 60
  gmm_covariance_type: "full"
  random_state: 42

stock_strength:
  weights:
    momentum: 0.20
    relative_strength: 0.25
    volume: 0.15
    trend: 0.20
    volatility_adjusted: 0.10
    liquidity: 0.10
  windows:
    short: 5
    medium: 20
    long: 60
  thresholds:
    very_strong: 80.0
    strong: 65.0
    neutral: 45.0
    weak: 30.0
  movement_threshold: 3.0 # Points change to trigger strengthening/weakening

sentiment:
  engine: "lexicon" # "finbert" or "lexicon"
  recency_decay_hours: 48.0 # exponential half-life for news weighting
  neutral_score: 50.0

fundamentals:
  max_stale_days: 180 # Quarter results stale after 180 days
  pe_healthy_max: 30.0
  pb_healthy_max: 4.0
  roe_healthy_min: 0.15
  de_healthy_max: 1.5

strategies:
  momentum:
    fast_window: 10
    slow_window: 50
    rsi_window: 14
    rsi_bullish_min: 50.0
    rsi_overbought: 75.0
    atr_window: 14
    atr_stop_multiplier: 2.0
    atr_target_multiplier: 3.5
  mean_reversion:
    bb_window: 20
    bb_std: 2.0
    rsi_window: 14
    rsi_oversold: 30.0
    rsi_overbought: 70.0
    atr_window: 14
    atr_stop_multiplier: 1.5
    atr_target_multiplier: 2.0
  breakout:
    channel_window: 20
    rvol_threshold: 1.3
    atr_window: 14
    atr_stop_multiplier: 2.0
    atr_target_multiplier: 4.0
  fi2010_microstructure:
    min_imbalance: 0.20
    prob_threshold: 0.50

decision_engine:
  weights:
    predictive_model: 0.25
    stock_strength: 0.25
    strategy_signal: 0.20
    regime_alignment: 0.15
    sentiment_fundamentals: 0.15
  thresholds:
    yes_threshold: 68.0
    wait_upper_threshold: 67.9
    wait_lower_threshold: 40.0
    no_threshold: 39.9
    min_confidence: 0.45
  require_risk_approval: false

portfolio:
  allocation_method: "min_variance" # options: "equal_weight", "min_variance", "mean_variance", "risk_parity"
  rebalance_frequency: "monthly"
  max_asset_weight: 0.25 # Max 25% allocation to any single stock
  min_asset_weight: 0.02 # Min 2% allocation to included stocks
  cash_reserve: 0.05 # 5% minimum cash buffer
  max_total_exposure: 0.95 # Max 95% total invested
  long_only: true
  risk_free_rate: 0.065 # 6.5% Indian 10Y G-Sec benchmark

risk_management:
  max_portfolio_drawdown: 0.15 # 15% maximum portfolio drawdown before HALT
  daily_loss_limit: 0.03 # 3% daily loss triggers RESTRICTED state
  position_risk_budget_pct: 0.01 # 1% portfolio risk per trade
  max_position_size_pct: 0.20 # Max 20% portfolio capital per trade
  default_stop_loss_pct: 0.02 # 2% default stop loss if ATR unavailable
  atr_multiplier: 2.0
  trailing_stop_activation: 0.03 # Trailing stop activates after +3% gain
  trailing_stop_distance: 0.015 # 1.5% trailing distance
  var_confidence: 0.95 # 95% confidence level for VaR / CVaR
  max_leverage: 1.0 # Long-only cash equity (no leverage)

execution:
  default_slippage_bps: 2.0
  brokerage_pct: 0.0003
  stt_pct: 0.00025 # Securities Transaction Tax (NSE equity delivery/intraday blend)
  exchange_turnover_fee_pct: 0.0000345
  sebi_charges_pct: 0.000001
  stamp_duty_pct: 0.00003
  gst_pct: 0.18 # 18% on (brokerage + exchange charges)
  latency_ms: 10.0

backtesting:
  initial_capital: 1000000.0
  risk_free_rate: 0.065 # 6.5% Indian 10Y G-Sec benchmark
  benchmark_symbol: "NIFTY50"

paper_trading:
  initial_capital: 1000000.0
  cash_reserve_pct: 0.05
  default_mode: "historical_replay" # "historical_replay" or "live_feed"
  stale_data_timeout_sec: 300.0
  replay_speed_multiplier: 1.0
  db_path: "data/paper_trading.db"

